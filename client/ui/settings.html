<div class="center panel main">
    <p class="title text">
        Virus vs Antivirus
    </p>

    <p class="undertext text">
        {soundsettings}
    </p>

    <div class="settingsbutton">
        <button id="masterButtonOff">{off-pmasterbtn}</button>
        <button class="onbutton" id="masterButtonOn">{on-pmasterbtn}</button>
    </div>

    <p class="undertext text">
        {settingssoundeffects}
    </p>

    <div class="settingsbutton">
        <button id="sfxButtonOff">{off-psfxbtn}</button>
        <button class="onbutton" id="sfxButtonOn">{on-psfxbtn}</button>
    </div>

    <p class="undertext text">
        {settingsmusic}
    </p>

    <div class="settingsbutton">
        <button id="musicButtonOff">{off-pmusicbtn}</button>
        <button class="onbutton" id="musicButtonOn">{on-pmusicbtn}</button>
    </div>

    <div class="backb">
        <button class="backbutton" id="backBtn">{psettingsbtn}</button>
    </div>
</div>
