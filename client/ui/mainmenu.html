<div class="center panel main">
    <p class="title text">
        Virus vs Antivirus
    </p>

    <div class="start-container">
      <button class="start-btn" id="start">{startbutton}</button>      
    </div>

    <p class="undertext text">
        {pickmode}
    </p>

    <div class="modelist">
        <button class="text" id="virus">{pvirus}</button>
        <button class="text" id="antivirus">{pantivirus}</button>
        <button class="text" id="spectate">{pspectator}</button>
        <!-- <button class="text" id="watchai">Watch AI vs AI</button> -->
    </div>

    <div class="rules">
        <button class="text hidden" id="rules">{prules}</button>
        <button class="gamemode" id="virus">{pvirus}</button>
        <button class="gamemode" id="antivirus">{pantivirus}</button>
        <button class="gamemode" id="spectate">{pspectator}</button>
    </div>

    <p id="description"> {description}</p>

    <div class="lowest text">
      <button class="text" id="start">{startbutton}</button>
      <button class="text" id="playai">Play against AI</button> <!-- AI BUTTON -->    
    </div>
    <div class="bottom-row">
        <button class="icon-btn" id="languageBtn">
            <i data-lucide="globe"></i>
        </button>

        <button class="icon-btn" id="settingsBtn">
            <i data-lucide="settings"></i>
        </button>
    </div>

</div>
